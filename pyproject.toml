[project]
name = "swissmsplib"
version = "0.4.0"
description = "The **Swiss** **M**obile **S**ervice **P**rovider **Lib**rary (swissmsplib) is a client library that allows interacting with Swiss mobile service providers as if they would expose a public API."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
]

[tool.poetry]
packages = [{include = "swissmsplib", from = "src"}]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^8.0.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
